openapi: 3.1.0
info:
  title: Layanan Manajemen Stok & Konsinyasi Tahu Tempe
  version: 2.0.0
  description: >
    REST API design-first untuk pengelolaan stok gudang pabrik tahu/tempe dan siklus
    distribusi konsinyasi harian (pengambilan pagi dan rekonsiliasi setoran sore).
  contact:
    name: Kelompok Anti-Normal - Integrasi Cloud
servers:
  - url: http://localhost:8000/api/v1
    description: Server Pengembangan Lokal (Laravel Sail)

tags:
  - name: Produk
    description: Manajemen katalog produk tahu/tempe dan pencatatan hasil produksi gudang
  - name: Pedagang
    description: Manajemen mitra pedagang keliling dan warung
  - name: Konsinyasi
    description: Siklus manifest pengambilan pagi dan rekonsiliasi setoran sore

paths:
  /produk:
    get:
      tags: [Produk]
      summary: Daftar semua produk dan stok gudang
      operationId: listProduk
      responses:
        '200':
          description: Daftar produk berhasil diambil
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Produk'
    post:
      tags: [Produk]
      summary: Tambah jenis produk tahu/tempe baru
      operationId: createProduk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProdukInput'
      responses:
        '201':
          description: Produk baru berhasil ditambahkan
          headers:
            Location:
              description: URI detail produk yang baru dibuat
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Produk'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /produk/{kode_produk}/produksi:
    post:
      tags: [Produk]
      summary: Catat hasil produksi harian masuk ke stok gudang
      operationId: tambahProduksi
      parameters:
        - name: kode_produk
          in: path
          required: true
          schema:
            type: string
            example: TAHU-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProduksiInput'
      responses:
        '200':
          description: Stok gudang berhasil diperbarui dari hasil produksi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Produk'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /pedagang:
    get:
      tags: [Pedagang]
      summary: Daftar semua mitra pedagang keliling
      operationId: listPedagang
      responses:
        '200':
          description: Daftar pedagang berhasil diambil
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pedagang'
    post:
      tags: [Pedagang]
      summary: Daftarkan mitra pedagang baru
      operationId: createPedagang
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedagangInput'
      responses:
        '201':
          description: Pedagang berhasil didaftarkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedagang'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /konsinyasi:
    get:
      tags: [Konsinyasi]
      summary: Monitoring daftar manifest konsinyasi
      operationId: listKonsinyasi
      parameters:
        - name: status
          in: query
          required: false
          description: Filter berdasarkan status manifest
          schema:
            type: string
            enum: [BERJALAN, SELESAI]
      responses:
        '200':
          description: Daftar manifest konsinyasi berhasil diambil
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ManifestKonsinyasi'
    post:
      tags: [Konsinyasi]
      summary: Pengambilan pagi - Buat manifest konsinyasi baru (BR-01, BR-03, BR-04)
      operationId: ambilKonsinyasiPagi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmbilKonsinyasiInput'
      responses:
        '201':
          description: Manifest konsinyasi pagi berhasil dibuat dan stok gudang dipotong
          headers:
            Location:
              description: URI detail manifest konsinyasi
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestKonsinyasi'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /konsinyasi/{kode_manifest}/setoran:
    post:
      tags: [Konsinyasi]
      summary: Setoran sore - Rekonsiliasi barang terjual, retur layak, dan rusak (BR-02, BR-05)
      operationId: setorKonsinyasiSore
      parameters:
        - name: kode_manifest
          in: path
          required: true
          schema:
            type: string
            example: KSY-20261115-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetoranKonsinyasiInput'
      responses:
        '200':
          description: Rekonsiliasi setoran sore berhasil diselesaikan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestKonsinyasi'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

components:
  responses:
    NotFound:
      description: Resource tidak ditemukan
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Pelanggaran aturan bisnis (stok kurang, manifest ganda, atau sudah selesai)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Validasi input gagal atau hitungan rekonsiliasi tidak seimbang
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Produk:
      type: object
      required: [kode_produk, nama_produk, jenis_produk, harga_satuan, stok_gudang, tersedia]
      properties:
        kode_produk:
          type: string
          example: TAHU-001
        nama_produk:
          type: string
          example: Tahu Putih
        jenis_produk:
          type: string
          enum: [tahu, tempe]
        harga_satuan:
          type: integer
          minimum: 0
          example: 4000
        stok_gudang:
          type: integer
          minimum: 0
          example: 100
        tersedia:
          type: boolean
          example: true

    ProdukInput:
      type: object
      required: [nama_produk, jenis_produk, harga_satuan, stok_awal]
      properties:
        nama_produk:
          type: string
          example: Tahu Putih
        jenis_produk:
          type: string
          enum: [tahu, tempe]
        harga_satuan:
          type: integer
          minimum: 0
          example: 4000
        stok_awal:
          type: integer
          minimum: 0
          example: 100

    ProduksiInput:
      type: object
      required: [jumlah_produksi]
      properties:
        jumlah_produksi:
          type: integer
          minimum: 1
          example: 50
        catatan:
          type: string
          example: Produksi kloter pagi

    Pedagang:
      type: object
      required: [kode_pedagang, nama_pedagang, no_telepon, aktif]
      properties:
        kode_pedagang:
          type: string
          example: PDG-001
        nama_pedagang:
          type: string
          example: Pak Budi
        no_telepon:
          type: string
          example: "081234567890"
        wilayah_jualan:
          type: [string, "null"]
          example: Pasar Baru
        aktif:
          type: boolean
          example: true

    PedagangInput:
      type: object
      required: [nama_pedagang, no_telepon]
      properties:
        nama_pedagang:
          type: string
          example: Pak Budi
        no_telepon:
          type: string
          example: "081234567890"
        wilayah_jualan:
          type: string
          example: Pasar Baru

    AmbilKonsinyasiInput:
      type: object
      required: [kode_pedagang, items]
      properties:
        kode_pedagang:
          type: string
          example: PDG-001
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [kode_produk, jumlah_dibawa]
            properties:
              kode_produk:
                type: string
                example: TAHU-001
              jumlah_dibawa:
                type: integer
                minimum: 1
                example: 30

    SetoranKonsinyasiInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [kode_produk, jumlah_terjual, jumlah_retur_layak, jumlah_rusak]
            properties:
              kode_produk:
                type: string
                example: TAHU-001
              jumlah_terjual:
                type: integer
                minimum: 0
                example: 22
              jumlah_retur_layak:
                type: integer
                minimum: 0
                example: 5
              jumlah_rusak:
                type: integer
                minimum: 0
                example: 3

    ManifestKonsinyasi:
      type: object
      required:
        - kode_manifest
        - pedagang
        - tanggal_konsinyasi
        - status
        - waktu_ambil
        - total_tagihan_setoran
        - total_kerugian_waste
        - items
      properties:
        kode_manifest:
          type: string
          example: KSY-20261115-001
        pedagang:
          type: object
          properties:
            kode_pedagang:
              type: string
              example: PDG-001
            nama_pedagang:
              type: string
              example: Pak Budi
        tanggal_konsinyasi:
          type: string
          format: date
          example: "2026-11-15"
        status:
          type: string
          enum: [BERJALAN, SELESAI]
        waktu_ambil:
          type: string
          format: date-time
        waktu_setor:
          type: [string, "null"]
          format: date-time
        total_tagihan_setoran:
          type: integer
          example: 178000
        total_kerugian_waste:
          type: integer
          example: 12000
        items:
          type: array
          items:
            type: object
            properties:
              kode_produk:
                type: string
              nama_produk:
                type: string
              harga_satuan_snapshot:
                type: integer
              jumlah_dibawa:
                type: integer
              jumlah_terjual:
                type: integer
              jumlah_retur_layak:
                type: integer
              jumlah_rusak:
                type: integer

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          example: https://localhost:8000/api/v1/problems/409
        title:
          type: string
          example: Stok gudang tidak mencukupi
        status:
          type: integer
          example: 409
        detail:
          type: string
          example: Stok Tahu Putih di gudang tersisa 10, diminta 30.